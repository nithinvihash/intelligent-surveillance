<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PheNex - AI Video Analytics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
 
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
 
        header {
            text-align: center;
            margin-bottom: 40px;
        }
 
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
 
        .status {
            font-size: 1.1em;
            color: #00ff88;
        }
 
        .status.error {
            color: #ff4444;
        }
 
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
 
        .card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
 
        .card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
        }
 
        .card h2 {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #00ff88;
        }
 
        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 10px;
        }
 
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #00ff88;
            line-height: 1;
        }
 
        .stat-label {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 5px;
        }
 
        .video-container {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
 
        .video-header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            font-weight: bold;
            color: #00ff88;
        }
 
        .video-stream {
            width: 100%;
            height: 400px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 1.2em;
        }
 
        .video-stream img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
 
        .events-list {
            max-height: 300px;
            overflow-y: auto;
        }
 
        .event-item {
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid #00ff88;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 0.9em;
        }
 
        .event-time {
            color: #aaa;
            font-size: 0.8em;
        }
 
        .event-type {
            color: #00ff88;
            font-weight: bold;
        }
 
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            grid-column: 1 / -1;
        }
 
        button {
            background: linear-gradient(135deg, #00ff88 0%, #00cc77 100%);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
 
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3);
        }
 
        button:active {
            transform: translateY(0);
        }
 
        .grid-2 {
            grid-template-columns: 1fr 1fr;
        }
 
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
 
            .grid-2 {
                grid-template-columns: 1fr;
            }
 
            .video-container {
                grid-column: 1;
            }
 
            h1 {
                font-size: 1.8em;
            }
        }
 
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
 
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 PheNex - AI Video Analytics</h1>
            <div class="status" id="status">
                <span class="loading"></span> Connecting to backend...
            </div>
        </header>
 
        <div class="dashboard">
            <!-- Video Stream -->
            <div class="video-container">
                <div class="video-header">📹 Live Video Stream</div>
                <div class="video-stream" id="videoStream">
                    <img id="videoImg" src="/video_feed" alt="Video Stream" style="display: none;">
                    <span id="videoLoading">Loading stream...</span>
                </div>
            </div>
 
            <!-- Statistics -->
            <div class="card">
                <h2>📊 Statistics</h2>
                <div class="stat-box">
                    <div class="stat-value" id="totalEvents">0</div>
                    <div class="stat-label">Total Events</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="totalTracks">0</div>
                    <div class="stat-label">Active Tracks</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="currentFps">0</div>
                    <div class="stat-label">FPS</div>
                </div>
            </div>
 
            <!-- Event Breakdown -->
            <div class="card">
                <h2>📈 Event Breakdown</h2>
                <div class="stat-box">
                    <div class="stat-value" id="lineCrossings">0</div>
                    <div class="stat-label">Line Crossings</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="zoneEntries">0</div>
                    <div class="stat-label">Zone Entries</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="anprDetections">0</div>
                    <div class="stat-label">ANPR Detections</div>
                </div>
            </div>
 
            <!-- Recent Events -->
            <div class="card grid-2">
                <div>
                    <h2>🔔 Recent Events</h2>
                    <div class="events-list" id="eventsList">
                        <div class="event-item" style="color: #aaa;">No events yet...</div>
                    </div>
                </div>
            </div>
 
            <!-- Controls -->
            <div class="controls">
                <button onclick="refreshStats()">🔄 Refresh Stats</button>
                <button onclick="clearEvents()">🗑️ Clear Events</button>
                <button onclick="exportEvents()">💾 Export Events</button>
                <button onclick="toggleStream()">⏯️ Toggle Stream</button>
            </div>
        </div>
    </div>
 
    <script>
        // API base URL
        const API_BASE = 'http://localhost:8000';
        let eventSocket = null;
 
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Dashboard initializing...');
            checkBackend();
            refreshStats();
            initWebSocket();
            
            // Refresh stats every 5 seconds
            setInterval(refreshStats, 5000);
        });
 
        // Check if backend is running
        function checkBackend() {
            fetch(`${API_BASE}/api/health`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('status').innerHTML = '✅ Connected to backend';
                    document.getElementById('status').classList.remove('error');
                })
                .catch(err => {
                    document.getElementById('status').innerHTML = '❌ Backend not responding';
                    document.getElementById('status').classList.add('error');
                    console.error('Backend error:', err);
                });
        }
 
        // Refresh statistics
        function refreshStats() {
            fetch(`${API_BASE}/api/stats`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('totalEvents').textContent = data.total_events || 0;
                    document.getElementById('currentFps').textContent = (data.fps || 0).toFixed(1);
                    document.getElementById('lineCrossings').textContent = data.line_crossings || 0;
                    document.getElementById('zoneEntries').textContent = data.zone_entries || 0;
                    document.getElementById('anprDetections').textContent = data.anpr_detections || 0;
                    document.getElementById('totalTracks').textContent = data.active_tracks || 0;
                })
                .catch(err => console.error('Stats error:', err));
 
            // Fetch recent events
            fetch(`${API_BASE}/api/events?limit=10`)
                .then(r => r.json())
                .then(data => {
                    const eventsList = document.getElementById('eventsList');
                    const events = data.events || data || [];
                    
                    if (!events.length) {
                        eventsList.innerHTML = '<div class="event-item" style="color: #aaa;">No events yet...</div>';
                        return;
                    }
 
                    eventsList.innerHTML = events.map(e => `
                        <div class="event-item">
                            <div class="event-type">${e.type || 'unknown'}</div>
                            <div>Class: ${e.class || 'N/A'} | ID: ${e.track_id || 'N/A'}</div>
                            <div class="event-time">${new Date(e.timestamp * 1000).toLocaleTimeString()}</div>
                        </div>
                    `).join('');
                })
                .catch(err => console.error('Events error:', err));
        }
 
        // Initialize WebSocket for real-time updates
        function initWebSocket() {
            try {
                eventSocket = new WebSocket('ws://localhost:8000/ws');
                
                eventSocket.onopen = () => {
                    console.log('WebSocket connected');
                    document.getElementById('status').innerHTML = '✅ Real-time connection active';
                };
                
                eventSocket.onmessage = (event) => {
                    console.log('Event received:', event.data);
                    refreshStats();
                };
                
                eventSocket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };
                
                eventSocket.onclose = () => {
                    console.log('WebSocket closed');
                    setTimeout(initWebSocket, 3000); // Reconnect after 3s
                };
            } catch (err) {
                console.error('WebSocket init error:', err);
            }
        }
 
        // Control functions
        function clearEvents() {
            if (confirm('Clear all events from database?')) {
                fetch(`${API_BASE}/api/events/clear`, { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        alert('Events cleared');
                        refreshStats();
                    })
                    .catch(err => alert('Error: ' + err));
            }
        }
 
        function exportEvents() {
            fetch(`${API_BASE}/api/events/export`)
                .then(r => r.json())
                .then(data => {
                    const json = JSON.stringify(data, null, 2);
                    const blob = new Blob([json], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `events_${Date.now()}.json`;
                    a.click();
                })
                .catch(err => alert('Error: ' + err));
        }
 
        function toggleStream() {
            const img = document.getElementById('videoImg');
            img.style.display = img.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
